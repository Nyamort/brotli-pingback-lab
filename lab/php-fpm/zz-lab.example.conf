; OPTIONAL aggressive php-fpm limits for the lab.
;
; The lab uses the stock /usr/local/etc/php-fpm.d/www.conf by default:
;   pm = dynamic, pm.max_children = 5, no request_terminate_timeout.
; That is enough for the crash payload: a SIGSEGV kills the worker whatever
; the pool settings are.
;
; Mount this file only if you want a deterministic 4-worker pool and a 15s
; request timeout for the hang demo. Add this volume to the wordpress service:
;
;   - ./lab/php-fpm/zz-lab.example.conf:/usr/local/etc/php-fpm.d/zz-lab.conf:ro
;
; pm.max_children = 4 makes pool exhaustion easy; request_terminate_timeout
; is the only reliable backstop for the 86-byte non-progressing decode loop:
; curl's own CURLOPT_TIMEOUT does not fire while the Brotli write loop spins.
[www]
pm = static
pm.max_children = 4
pm.max_requests = 0

request_terminate_timeout = 15s

catch_workers_output = yes
decorate_workers_output = no
