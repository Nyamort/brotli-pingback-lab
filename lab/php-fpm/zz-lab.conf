; Lab-only php-fpm overrides.
;
; pm.max_children = 4 makes worker starvation / repeated crashes easy to
; observe.  request_terminate_timeout is the only reliable backstop for the
; 86-byte non-progressing decode loop: curl's own CURLOPT_TIMEOUT does not
; fire while the Brotli write loop is spinning.
[www]
pm = static
pm.max_children = 4
pm.max_requests = 0

request_terminate_timeout = 15s

catch_workers_output = yes
decorate_workers_output = no
