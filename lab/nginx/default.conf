server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64m;

    # The 86-byte payload intentionally stalls a PHP worker.  php-fpm's
    # request_terminate_timeout (15s) is the backstop; give nginx enough
    # time to observe the upstream death and return 502.
    fastcgi_read_timeout 60s;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
        fastcgi_pass wordpress:9000;
    }

    location ~ /\.ht {
        deny all;
    }
}
