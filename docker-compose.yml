name: brotli-pingback-lab

# CVE-2026-111497 WordPress XML-RPC pingback lab.
# Local only: WordPress fetches the payload from the `attacker` service.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: labroot
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    # Official image, pinned to the October 2026 digest (libbrotlidec 1.1.0).
    image: wordpress:php8.3-fpm@sha256:96b154deba743be45b87dfe45a1fd7b8f6c83a7899ace4b6cede8e514a0292bc
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${WP_PORT:-8080}');
        define('WP_SITEURL', 'http://localhost:${WP_PORT:-8080}');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      # Lab-only allowlist for the Docker-internal `attacker` host.
      - ./lab/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ./lab/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  attacker:
    build: ./lab/attacker
    restart: unless-stopped
    environment:
      PORT: "8080"
      CHUNK_DELAY: "${CHUNK_DELAY:-1.0}"
    ports:
      - "${ATTACKER_PORT:-8081}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  wp-init:
    image: wordpress:cli
    profiles: ["init"]
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    restart: "no"
    user: "33:33"
    working_dir: /var/www/html
    environment:
      HOME: /tmp
      WP_URL: "http://localhost:${WP_PORT:-8080}"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        for i in $$(seq 1 90); do
          [ -f /var/www/html/wp-config.php ] && break
          sleep 2
        done
        for i in $$(seq 1 60); do
          wp db check --allow-root >/dev/null 2>&1 && break
          sleep 3
        done
        wp core is-installed --allow-root >/dev/null 2>&1 || \
          wp core install --url="$${WP_URL}" --title="Brotli Pingback Lab" \
            --admin_user=admin --admin_password=admin \
            --admin_email=admin@example.test --skip-email --allow-root
        wp option update default_pingback_flag 1 --allow-root >/dev/null 2>&1 || true
        wp option update default_ping_status open --allow-root >/dev/null 2>&1 || true
        wp post list --post_type=post --format=ids --allow-root | grep -q . || \
          wp post create --post_title="Pingback target" --post_status=publish \
            --post_content="CVE-2026-111497 lab target" --allow-root
        wp post list --post_type=post --fields=ID,post_title,ping_status --allow-root

volumes:
  db_data:
  wp_data:
